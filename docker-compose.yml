#Starter backend og frontend med én kommando
#Køres med docker compose up

#OBS Begge services bruger samme requirements.txt fra roden

#kilde: https://docs.docker.com/compose/intro/compose-application-model/

services:

#Træner modellen under build og indlæser data ved opstart.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # FastAPI API port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env

#Kommunikerer med backend via http://backend:8000
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    #Streamlit app på port 8501
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend